name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复触发取消掉旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 .nvmrc、Dockerfile 的 ARG NODE_IMAGE 保持一致。
  # 三处都是 24：engines 里的 >=22 只是最低门槛，实际开发与构建统一跑 24。
  NODE_VERSION: '24'
  # 与 Dockerfile 里的 ARG PNPM_VERSION 保持一致。
  # pnpm/action-setup 不会自动推断版本（package.json 里刻意不放
  # packageManager 字段，否则 pnpm 会把自己写进 lockfile），必须显式指定。
  PNPM_VERSION: '12.9.1'

jobs:
  # ---------------------------------------------------------------------------
  # 1. 安装依赖 → 构建 → 对产物做冒烟测试
  # ---------------------------------------------------------------------------
  build-and-test:
    name: 构建与产物测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # lastUpdated 依赖完整的 git 历史
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建站点
        run: pnpm build

      - name: 冒烟测试（检查 dist 产物）
        run: pnpm test

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 2. 用 Dockerfile 的 test 阶段跑同一套校验，验证容器构建链路
  # ---------------------------------------------------------------------------
  docker-test:
    name: Docker 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并运行 test 阶段
        run: |
          docker build \
            --target test \
            --tag vitepress-gitbook-template:test \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: 构建运行时镜像
        run: |
          docker build \
            --target runtime \
            --tag vitepress-gitbook-template:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            .

      - name: 启动容器并做 HTTP 校验
        run: |
          set -e
          docker run -d --name docs-verify -p 8080:80 vitepress-gitbook-template:latest

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            [ "$i" -eq 30 ] && { docker logs docs-verify; exit 1; }
            sleep 1
          done

          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$1")
            echo "$1 -> $code"
            [ "$code" = "$2" ] || exit 1
          }

          check / 200
          check /guide/ 200
          check /features/mermaid.html 200
          check /this-does-not-exist 404

          curl -sS http://127.0.0.1:8080/ | grep -q 'GitBook Style Docs'
          curl -sS http://127.0.0.1:8080/features/mermaid.html | grep -q 'gb-mermaid'

      - name: 清理
        if: always()
        run: docker rm -f docs-verify || true
