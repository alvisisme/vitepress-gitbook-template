# =============================================================================
#  Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#  需要改端口、域名、缓存策略时改这里。
#
#  提示：本文件里凡是自己写了 add_header 的 location，
#  都必须 include 一次 security-headers.conf，
#  否则 nginx 不会再把 server 级别的安全头带下来（这是 nginx 的继承规则）。
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # ---------------------------------------------------------------- 路由
    # VitePress 关闭了 cleanUrls，所以每个页面都有真实的 .html 文件。
    # 这里额外支持三种写法：/guide/、/guide、/guide.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # ---------------------------------------------------------------- 缓存
    # 带 hash 的资源可以永久缓存。
    # 用 ^~ 让这个前缀匹配直接结束，避免被下面的正则 location 抢走。
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML 不缓存，保证发版后刷新即可生效
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # 其它静态资源（图片、字体、svg 等）缓存一周。
    # 注意：正常情况下它们已经在 /assets/ 里由上面的规则接管，
    # 这里只是兜底（例如手动放到 public/ 根目录的文件）。
    location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ---------------------------------------------------------------- 压缩
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------- 其它
    # 隐藏文件一律拒绝（.well-known 例外，ACME 验证要用）
    location ~ /\.(?!well-known) {
        deny all;
    }

    client_max_body_size 8m;
}
