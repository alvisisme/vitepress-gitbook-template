# =============================================================================
#  Nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）
#  需要改端口、域名、缓存策略时改这里。
# =============================================================================

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    # ---------------------------------------------------------------- 路由
    # VitePress 关闭了 cleanUrls，所以每个页面都有真实的 .html 文件。
    # 这里额外支持三种写法：/guide/、/guide、/guide.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # ---------------------------------------------------------------- 缓存
    # 带 hash 的资源可以永久缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # HTML 不缓存，保证发版后立刻生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # 其它静态资源（图片、字体、svg、md 等）缓存一周
    location ~* \.(?:svg|png|jpe?g|gif|webp|avif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------------------------------------------------- 压缩
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;

    # ---------------------------------------------------------------- 安全头
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()"  always;

    # ---------------------------------------------------------------- 其它
    # 隐藏隐藏文件
    location ~ /\.(?!well-known) {
        deny all;
    }

    client_max_body_size 8m;
}
