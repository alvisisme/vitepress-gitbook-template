# =============================================================================
#  安全响应头（被 nginx.conf 里多个 location 复用）
#
#  为什么要单独抽一个文件？
#  nginx 的 add_header 只在「当前层级没有定义任何 add_header」时才继承上层。
#  也就是说，只要某个 location 里写了一行 add_header Cache-Control ...，
#  server 级别的这几个安全头在那个 location 里就全部失效了。
#  所以凡是自己加了 add_header 的 location，都要显式 include 一次。
#
#  容器内路径：/etc/nginx/snippets/security-headers.conf
# =============================================================================

add_header X-Content-Type-Options   "nosniff"                         always;
add_header X-Frame-Options          "SAMEORIGIN"                      always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=()"   always;
